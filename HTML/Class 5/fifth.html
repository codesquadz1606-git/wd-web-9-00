<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Form -->
    <form>
        <label for="fname">First Name :</label>
        <input type="text" placeholder="Enter the First Name" id="fname">
        <br>
        <label for="lname">Last Name :</label>
        <input type="text" placeholder="Enter your Last Name" id="lname">
        <br>
        <label for="">Gender :</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br>
        <label for="">Phone Number :</label>
        <input type="number">

        <br>
        <label for="">Create Password :</label>
        <input type="password">
        <br>
        <label for="">Email :</label>
        <input type="email">
        <br>
        <label for="">Hobbies :</label>
        <input type="checkbox"> Reading
        <input type="checkbox"> Writing
        <br>
        <label for="">Education :</label>
        <select name="" id="">
            <option value="">--Select Any One--</option>
            <option value="">High School</option>
            <option value="">Inter School</option>
            <option value="">Graduate</option>
            <option value="">Post Graduate</option>
        </select>
        <br>
        <label for="">Date of Birth :</label>
        <input type="datetime-local">
        <br>
        <label for="">Upload Docs :</label>
        <input type="file">
        <br>
        <label for="">Share your Feedback :</label>
        <textarea name="" id=""></textarea>
        <br>
        <input type="submit" value="Create Account">
        <input type="reset" value="Delete Data">
    </form>

    <hr>

    <form action="">
        <table>
        <tr>
            <td>Username</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Password:</td>
            <td><input type="password"></td>
        </tr>
        <tr>
            <td>City of <br> Employment</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Web Server</td>
            <td>
                <select name="" id="">
                    <option value="">--Choose A Server--</option>
                    <option value="">Apache</option>
                    <option value="">AWS</option>
                    <option value="">GCP</option>
                </select>
            </td>
        </tr>
        <tr>
            <td rowspan="4">Please Specify <br> your Role</td>
            <td>
                <input type="radio" name="role">Admin
            </td>
        </tr>
        <tr>
            <td><input type="radio" name="role">Engineer</td>
        </tr>
        <tr>
            <td><input type="radio" name="role">Manager</td>
        </tr>
        <tr>
            <td><input type="radio" name="role">Guest</td>
        </tr>
        <tr>
            <td rowspan="3">Single Sign-on <br> to the following</td>
            <td><input type="checkbox">Mail</td>
        </tr>
        <tr>
            <td><input type="checkbox">Payroll</td>
        </tr>
        <tr>
            <td><input type="checkbox">Self-Service</td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="submit" value="Login">
                <input type="reset">
            </td>
        </tr>
        </table>
    </form>

</body>
</html>
